<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050816">
<title>RAYONE Core</title>
<!--
RAYONE CORE — standalone particle core (final design)
Needs: Three.js is served locally from the installed npm dependency, a backend  POST /api/chat  {messages:[{role,content}]} -> {reply}
Public API:  RayoneCore.setState('idle'|'listening'|'thinking'|'speaking')
             RayoneCore.setShape('human'|'heart'|'dna'|'knot'|'sphere' | any text)
             RayoneCore.customShape(parts,name)   RayoneCore.pulse()   RayoneCore.setLevel(0..1)
Helpers below the core: listen() (mic + live level + voice shape commands), speak(text), handleText(text)
-->
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:#050816;color:#e6ecff;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overflow:hidden}
#rayone-canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
</style>
</head>
<body>
<canvas id="rayone-canvas"></canvas>
<!-- DEMO CONTROLS (delete in your project) -->
<div id="demo">
 <div id="msg"></div>
 <div class="r"><button data-s="idle">Idle</button><button data-s="listening">Listening</button><button data-s="thinking">Thinking</button><button data-s="speaking">Speaking</button></div>
 <div class="r"><input id="txt" placeholder="human / heart / dna / sher banao ..."><button id="go" style="flex:none;padding:10px 14px">Go</button><button id="mic" style="flex:none;padding:10px 14px">🎙</button></div>
</div>
<script src="/api/three"></script>
<script>
/* ============ 1) CONFIG ============ */
const CONFIG={ENDPOINT:'/api/chat',LANG:'hi-IN'};
async function askAI(messages){ // your backend: key stays on server
  const r=await fetch(CONFIG.ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages})});
  if(!r.ok)throw new Error('http '+r.status);const j=await r.json();return j.reply||'';
}

/* ============ 2) RAYONE CORE (WebGL particle core) ============ */
const RayoneCore=(function(){
 const cv=document.getElementById('rayone-canvas'),slow=(navigator.hardwareConcurrency||4)<=4||innerWidth<700,N=slow?15000:34000;
 const NAMES=['sphere','knot','human','heart','dna'];
 const KW=[['sphere','ball','gola','गोला','normal','default','wapas','वापस'],['knot','quantum','गांठ'],['human','insan','insaan','insani','इंसान','इन्सान','मानव','manav','aadmi','आदमी','person','face','chehra','चेहरा','bust','woman','man'],['heart','dil','दिल','love'],['dna','helix','डीएनए']];
 let state='idle',want=0,cur=0,morph=-1,micLvl=0,micReal=false,env=0,ok=false,fill=null;
 function detect(t){const ws=String(t).toLowerCase().split(/[^\p{L}\p{M}]+/u);for(let i=KW.length-1;i>=0;i--){if(ws.some(w=>KW[i].includes(w)||(i===2&&(w.startsWith('insa')||w.startsWith('human')))))return i}return -1}
 const api={
  setState(s){state=s},getState(){return state},shapes:NAMES,detectShape:detect,
  setShape(x){const i=typeof x==='number'?x:detect(x);if(i<0||i===want)return -1;want=i;return i},
  customShape(parts,name){if(!fill)return -1;want=fill(parts,name);return want},
  pulse(){env=1},setLevel(v){micLvl=v;micReal=true},clearLevel(){micReal=false;micLvl=0},isReady(){return ok}
 };
 if(!window.THREE)return api;let ren;try{ren=new THREE.WebGLRenderer({canvas:cv,antialias:false})}catch(e){return api}
 ok=true;const pr=Math.min(devicePixelRatio||1,2);ren.setPixelRatio(pr);ren.setSize(innerWidth,innerHeight,false);ren.setClearColor(0x050816,1);
 const sc=new THREE.Scene(),cam=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.1,50),R=Math.random,g=()=>(R()+R()+R()-1.5)*.5;
 const rv=()=>{const u=R()*2-1,a=R()*6.283,q=Math.sqrt(1-u*u);return[Math.cos(a)*q,u,Math.sin(a)*q]};
 function human(){const r=R();
  if(r<.4){const d=rv();return[d[0]*.5+g()*.03,.62+d[1]*.64+g()*.03,d[2]*.52+g()*.03]}
  if(r<.44){const e=R()<.5?-1:1,d=rv();return[e*.18+d[0]*.07,.78+d[1]*.07,.47+d[2]*.04]}
  if(r<.455){const d=rv();return[d[0]*.05,.52+d[1]*.1,.56+Math.abs(d[2])*.07]}
  if(r<.5){const x=(R()*2-1)*.2;return[x,.25+g()*.012,.52*Math.sqrt(Math.max(0,1-.334-(x/.5)*(x/.5)))+.03]}
  if(r<.56){const a=R()*6.283;return[Math.cos(a)*.17+g()*.02,-.4+R()*.4,Math.sin(a)*.17+g()*.02]}
  const d=rv();return[d[0]*1.15,-.95+Math.abs(d[1])*.6,d[2]*.45]}
 const fns=[()=>{const d=rv(),k=1.5+g()*.08;return[d[0]*k,d[1]*k,d[2]*k]},
 ()=>{const t=R()*6.283,m=1.1+.35*Math.cos(3*t),j=.12;return[m*Math.cos(2*t)*1.1+g()*j,.7*Math.sin(3*t)+g()*j,m*Math.sin(2*t)*1.1+g()*j]},
 human,
 ()=>{const t=R()*6.283,k=Math.pow(R(),.35)*.095;return[16*Math.pow(Math.sin(t),3)*k,(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t))*k-.05,g()*.9*Math.pow(R(),.3)]},
 ()=>{const t=(R()*2-1)*3,s=R()<.5?0:Math.PI,r=.9;return R()<.12?(()=>{const f=1-2*R();return[Math.cos(t*2)*r*f,t*.5,Math.sin(t*2)*r*f]})():[Math.cos(t*2+s)*r+g()*.08,t*.5,Math.sin(t*2+s)*r+g()*.08]}];
 const A=fns.map(f=>{const a=new Float32Array(N*3);for(let i=0;i<N;i++){const p=f();a[i*3]=p[0];a[i*3+1]=p[1];a[i*3+2]=p[2]}return a});
 A.push(new Float32Array(N*3),new Float32Array(N*3)); // two slots for AI-generated shapes
 const cl=(v,a,b)=>Math.max(a,Math.min(b,+v||0)),V=a=>[cl(a&&a[0],-3,3),cl(a&&a[1],-3,3),cl(a&&a[2],-3,3)];
 fill=(parts,name)=>{const slot=want===5?6:5;parts=parts.slice(0,24).map(o=>({t:o.t,p:V(o.p),q:V(o.q||o.p),d:[cl(o.d&&o.d[0],.02,3),cl(o.d&&o.d[1],.02,3),cl(o.d&&o.d[2],.02,3)],w:cl(o.w==null?1:o.w,.05,10)}));
  let tot=0;const cw=parts.map(o=>tot+=o.w),out=A[slot];
  for(let i=0;i<N;i++){const r0=R()*tot;let k=0;while(cw[k]<r0&&k<parts.length-1)k++;const o=parts[k],p=o.p,d=o.d;let x,y,z;
   if(o.t==='s'){const v=rv();x=p[0]+v[0]*d[0];y=p[1]+v[1]*d[0];z=p[2]+v[2]*d[0]}
   else if(o.t==='e'){const v=rv();x=p[0]+v[0]*d[0];y=p[1]+v[1]*d[1];z=p[2]+v[2]*d[2]}
   else if(o.t==='c'){const q=o.q,ax=[q[0]-p[0],q[1]-p[1],q[2]-p[2]],L=Math.hypot(...ax)||1,a=ax.map(c=>c/L),v=rv(),dt=v[0]*a[0]+v[1]*a[1]+v[2]*a[2],pw=[v[0]-dt*a[0],v[1]-dt*a[1],v[2]-dt*a[2]],wl=Math.hypot(...pw)||1,t=R();x=p[0]+ax[0]*t+pw[0]/wl*d[0];y=p[1]+ax[1]*t+pw[1]/wl*d[0];z=p[2]+ax[2]*t+pw[2]/wl*d[0]}
   else if(o.t==='b'){const f=R()*3|0,u=[(R()*2-1)*d[0],(R()*2-1)*d[1],(R()*2-1)*d[2]];u[f]=(R()<.5?-1:1)*d[f];x=p[0]+u[0];y=p[1]+u[1];z=p[2]+u[2]}
   else if(o.t==='r'){const u=R()*6.283,v=R()*6.283,rr=d[0]+d[1]*Math.cos(v);x=p[0]+rr*Math.cos(u);y=p[1]+rr*Math.sin(u);z=p[2]+d[1]*Math.sin(v)}
   else{const t=R(),u=R()*6.283,rr=(1-t)*d[0];x=p[0]+Math.cos(u)*rr;y=p[1]+t*d[1];z=p[2]+Math.sin(u)*rr}
   out[i*3]=x+g()*.03;out[i*3+1]=y+g()*.03;out[i*3+2]=z+g()*.03}
  let mx=0,my=0,mz=0;for(let i=0;i<N;i++){mx+=out[i*3];my+=out[i*3+1];mz+=out[i*3+2]}mx/=N;my/=N;mz/=N;let ex=.01;
  for(let i=0;i<N;i++){out[i*3]-=mx;out[i*3+1]-=my;out[i*3+2]-=mz;ex=Math.max(ex,Math.abs(out[i*3]),Math.abs(out[i*3+1]),Math.abs(out[i*3+2]))}
  const k2=1.6/ex;for(let i=0;i<N*3;i++)out[i]*=k2;return slot};
 const geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.BufferAttribute(A[0].slice(),3));geo.setAttribute('aTo',new THREE.BufferAttribute(A[1].slice(),3));
 const mat=new THREE.ShaderMaterial({transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,
 uniforms:{uMix:{value:0},uTime:{value:0},uAmp:{value:1},uBr:{value:0},uMouth:{value:0},uHuman:{value:0},uSize:{value:(slow?30:34)*pr}},
 vertexShader:`attribute vec3 aTo;uniform float uMix,uTime,uAmp,uBr,uMouth,uHuman,uSize;varying float vD;varying vec3 vC;
 void main(){vec3 p=mix(position,aTo,uMix);float w=sin(uMix*3.14159);
 float n=sin(p.x*2.+uTime)+sin(p.y*2.3+uTime*1.2)+sin(p.z*1.9+uTime*.8);
 float na=mix(1.,.35,uHuman);
 p+=normalize(p+.001)*n*.035*uAmp*na+vec3(sin(p.y*3.+uTime),sin(p.z*3.+uTime),sin(p.x*3.+uTime))*(.02*na+w*.35);
 float mo=uMouth*uHuman*step(abs(p.x),.24)*step(abs(p.y-.25),.07)*step(.3,p.z);p.y+=mo*(p.y>.25?.1:-.1);
 p*=1.+uBr;vec4 mv=modelViewMatrix*vec4(p,1.);gl_Position=projectionMatrix*mv;gl_PointSize=uSize/-mv.z;
 vD=smoothstep(-2.,2.,p.z);vC=mix(vec3(.05,.85,1.),vec3(.6,.3,1.),smoothstep(-1.6,1.6,p.y+sin(uTime*.5+p.x)*.4));}`,
 fragmentShader:`varying float vD;varying vec3 vC;void main(){float d=length(gl_PointCoord-.5);if(d>.5)discard;float a=pow(1.-d*2.,2.);gl_FragColor=vec4(vC*(.5+1.1*vD),a*.55);}`});
 const pts=new THREE.Points(geo,mat);sc.add(pts);
 function fit(){ren.setSize(innerWidth,innerHeight,false);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();const m=innerWidth<900;cam.position.z=m?9:5.4;pts.position.y=m?.9:.1}
 fit();addEventListener('resize',fit);
 let amp=1,spin=.15,rot=0,ry=0,rz=0,hum=0,mouth=0,last=performance.now(),t0=0;
 function loop(now){const dt=Math.min((now-last)/1000,.05);last=now;t0+=dt;const U=mat.uniforms;U.uTime.value=t0;
  const sim=.3+.3*Math.abs(Math.sin(t0*3.1)*Math.cos(t0*1.7)),L=state==='listening'?(micReal?micLvl:sim):0;
  env*=.92;const sp=state==='speaking'?Math.min(1,env+.25*Math.abs(Math.sin(t0*9))):0;
  const ta=state==='speaking'?1.2+sp*3:state==='thinking'?1.8:state==='listening'?1.2+L*4:1,ts=state==='thinking'?1.1:state==='speaking'?.45:state==='listening'?.25:.15;
  amp+=(ta-amp)*.12;spin+=(ts-spin)*.05;rot+=spin*dt;U.uAmp.value=amp;
  U.uBr.value=state==='speaking'?.02+.1*sp:state==='listening'?.02+.12*L:state==='thinking'?-.06+.03*Math.sin(t0*9):.02*Math.sin(t0*1.5);
  mouth+=(sp-mouth)*.4;U.uMouth.value=mouth;hum+=((cur===2&&morph<0?1:0)-hum)*.1;U.uHuman.value=hum;
  if(morph<0&&want!==cur){geo.attributes.aTo.array.set(A[want]);geo.attributes.aTo.needsUpdate=true;morph=0}
  if(morph>=0){morph+=dt/1.4;const m=Math.min(morph,1);U.uMix.value=m*m*(3-2*m);
   if(morph>=1){geo.attributes.position.array.set(A[want]);geo.attributes.position.needsUpdate=true;U.uMix.value=0;cur=want;morph=-1}}
  const hv=want===2;ry+=((hv?Math.sin(t0*.6)*.3:rot)-ry)*.08;rz+=((hv&&state==='listening'?.12:0)-rz)*.06;
  pts.rotation.y=ry;pts.rotation.z=rz;pts.rotation.x=Math.sin(t0*.3)*.15+(hv?.05*sp*Math.sin(t0*8):0);
  ren.render(sc,cam);requestAnimationFrame(loop)}
 requestAnimationFrame(loop);
 return api})();

/* ============ 3) VOICE + AI HELPERS ============ */
const INTENT=/(bana|banao|bano|ban\s?jao|ban\s?ja|dikha|show|make|become|turn into|shape|form|draw|create|बना|बनो|दिखा|आकार)/i;
const SYS='You are RAYONE, a concise, warm AI assistant. Reply in the same language the user writes in (Hinglish/Hindi/English), max 3 short sentences. The 3D particle core on screen can morph into any shape or object the user asks for (it is generated automatically); if asked, just confirm briefly that you are forming it.';
const SHAPEP=`Convert the request into a 3D point-cloud object built from primitives. Reply with ONLY JSON, no text, no code fence: {"name":"short english name","parts":[{"t":"s","p":[x,y,z],"d":[r],"w":1}]}.
Primitive types (t): s=sphere d=[radius]; e=ellipsoid d=[rx,ry,rz]; c=cylinder/limb from p to q with q:[x,y,z] and d=[radius]; b=box d=[hx,hy,hz]; r=torus ring in XY plane d=[ringRadius,tubeRadius]; k=cone with base centre p, pointing up, d=[baseRadius,height].
Rules: y is up, object faces +z, whole object fits within -1.5..1.5 on each axis. Use 8 to 20 parts so the object is clearly recognisable. w = relative surface weight. If the request is not about a visible object or shape, reply {"name":"none","parts":[]}.`;
const $=id=>document.getElementById(id);function say(t){const m=$('msg');if(m){m.textContent=t;clearTimeout(say._t);say._t=setTimeout(()=>m.textContent='',2500)}window.parent!==window&&window.parent.postMessage({type:'rayone-event',event:'status',text:String(t)},'*')}
function parseShape(t){try{return JSON.parse(t.slice(t.indexOf('{'),t.lastIndexOf('}')+1))}catch(e){return null}}
async function generateShape(text){say('Shape ban rahi hai...');
 try{const j=parseShape(await askAI([{role:'user',content:SHAPEP+'\n\nRequest: '+text}]));
  if(!j||!Array.isArray(j.parts)||!j.parts.length||j.name==='none')return;RayoneCore.customShape(j.parts,j.name);say('Shape: '+j.name)}catch(e){say('Ye shape nahi ban payi')}}
const hist=[];let busy=false;
function speak(txt,done){const ss=window.speechSynthesis;RayoneCore.setState('speaking');
 const end=()=>{RayoneCore.setState('idle');busy=false;done&&done()};
 if(!ss||!window.SpeechSynthesisUtterance){RayoneCore.pulse();setTimeout(end,Math.min(txt.length*45,6000));return}
 ss.cancel();const u=new SpeechSynthesisUtterance(txt);u.onstart=u.onboundary=()=>RayoneCore.pulse();u.onend=u.onerror=end;ss.speak(u)}
async function handleText(text){text=text.trim();if(!text||busy)return;busy=true;
 const k=RayoneCore.detectShape(text);if(k>=0)RayoneCore.setShape(k);else if(INTENT.test(text))generateShape(text);
 RayoneCore.setState('thinking');hist.push({role:'user',content:text});
 let reply;try{reply=await askAI([{role:'system',content:SYS},...hist]);hist.push({role:'assistant',content:reply})}
 catch(e){hist.pop();reply='AI server se connect nahi ho paya.'}
 say(reply.slice(0,90));window.parent!==window&&window.parent.postMessage({type:'rayone-event',event:'reply',text:reply},'*');speak(reply)}
/* mic: live level for the core + speech recognition + instant voice shape commands */
let aCtx=null,aStream=null;
async function startLevel(){try{aStream=await navigator.mediaDevices.getUserMedia({audio:true});aCtx=new(window.AudioContext||window.webkitAudioContext)();const an=aCtx.createAnalyser();an.fftSize=256;aCtx.createMediaStreamSource(aStream).connect(an);const d=new Uint8Array(an.frequencyBinCount);
 (function l(){if(!aStream)return;an.getByteFrequencyData(d);let s=0;for(let i=0;i<d.length;i++)s+=d[i];RayoneCore.setLevel(Math.min(1,s/d.length/60));requestAnimationFrame(l)})()}catch(e){RayoneCore.clearLevel()}}
function stopLevel(){if(aStream)aStream.getTracks().forEach(t=>t.stop());aStream=null;if(aCtx&&aCtx.close)aCtx.close();aCtx=null;RayoneCore.clearLevel()}
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;let rec=null;
function listen(){if(!SR){say('Is browser mein mic support nahi hai');return}if(rec){rec.stop();return}
 let heard='';rec=new SR();rec.lang=CONFIG.LANG;rec.interimResults=true;
 rec.onstart=()=>{startLevel();RayoneCore.setState('listening');const m=$('mic');if(m)m.classList.add('on');window.parent!==window&&window.parent.postMessage({type:'rayone-event',event:'listening'},'*')};
 rec.onresult=e=>{heard=Array.from(e.results).map(r=>r[0].transcript).join('');const t=$('txt');if(t)t.value=heard;RayoneCore.setShape(heard);window.parent!==window&&window.parent.postMessage({type:'rayone-event',event:'transcript',text:heard},'*')};
 rec.onerror=e=>say('Mic: '+e.error);
 rec.onend=()=>{stopLevel();rec=null;const m=$('mic');if(m)m.classList.remove('on');if(heard.trim())handleText(heard);else RayoneCore.setState('idle')};
 try{rec.start()}catch(e){rec=null}}

if(!RayoneCore.isReady())say('WebGL is not available on this device');
</script>
</body>
</html>
